[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ronio-boundary-formalism"
version = "1.0.0"
authors = [
    { name = "Christopher Thomas Ronio" }
]
description = "A crash-invariant logic routing engine based on the Ronio Boundary Formalism."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
"Homepage" = "https://github.com"
